name: Build Debug APKs

# Workflow für manuellen Build von Debug-APKs (ohne Signing)
# Kann manuell über GitHub Actions UI ausgelöst werden
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Grund für den Build'
        required: false
        default: 'Manual build request'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-35
            build-tools;35.0.0
            platform-tools
          accept-android-sdk-licenses: true
      
      - name: Gradle Cache
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.10.2'
      
      - name: Download dependencies
        run: ./gradlew --no-daemon dependencies
      
      - name: Build Mobile Debug APK
        run: ./gradlew :mobile:assembleDebug --no-daemon --stacktrace
      
      - name: Build Wear Debug APK
        run: ./gradlew :wear:assembleDebug --no-daemon --stacktrace
      
      - name: Rename APK files
        run: |
          # Mobile APK
          MOBILE_APK=$(find mobile/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -n "$MOBILE_APK" ]; then
            cp "$MOBILE_APK" mobile-debug.apk
            echo "Mobile APK: mobile-debug.apk"
          fi
          
          # Wear APK
          WEAR_APK=$(find wear/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -n "$WEAR_APK" ]; then
            cp "$WEAR_APK" wear-debug.apk
            echo "Wear APK: wear-debug.apk"
          fi
          
          ls -lh *.apk || echo "No APKs found"
      
      - name: Upload Debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            mobile-debug.apk
            wear-debug.apk
          retention-days: 7
