name: Build PR

# Workflow für Pull Requests - baut Debug- und Release-APKs und führt Tests aus
on:
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch release tags
        run: git fetch --tags --force --quiet
      
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Install Android SDK
        run: ./scripts/ci-install-android-sdk.sh
      
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check version consistency
        run: ./scripts/check-version.sh
      
      - name: Run tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Check Room schema export is committed
        run: |
          if [ -n "$(git status --porcelain -- core/database/schemas)" ]; then
            echo "Room schema export drifted from the committed files"
            git status --porcelain -- core/database/schemas
            git diff -- core/database/schemas
            exit 1
          fi
      
      - name: Build Debug and Release APKs
        run: ./gradlew :mobile:assemble :wear:assemble --no-daemon --stacktrace

      - name: Check minified release APKs
        run: |
          ./scripts/check-release-apk.sh "$(find mobile/build/outputs/apk/release -name '*.apk' | head -n 1)"
          ./scripts/check-release-apk.sh "$(find wear/build/outputs/apk/release -name '*.apk' | head -n 1)"
      
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: pr-apks
          path: |
            mobile/build/outputs/apk/debug/
            wear/build/outputs/apk/debug/
          retention-days: 7
