name: Build PR

# Workflow für Pull Requests - baut Debug APKs und führt Tests aus
on:
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Set up Android SDK Environment
        run: |
          SDK_BIN=$(dirname $(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager | head -n 1))
          echo "$SDK_BIN" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      
      - name: Gradle Cache
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.10.2'
      
      - name: Run tests
        run: gradle test --no-daemon --stacktrace
      
      - name: Build Debug APKs
        run: gradle :mobile:assembleDebug :wear:assembleDebug --no-daemon --stacktrace
      
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: pr-apks
          path: |
            mobile/build/outputs/apk/debug/
            wear/build/outputs/apk/debug/
          retention-days: 7
