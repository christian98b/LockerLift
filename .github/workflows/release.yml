name: Build and Release APKs

# Workflow wird ausgelöst, wenn ein neues Tag mit dem Muster 'v*' gepusht wird
# Beispiel: git tag v1.7.0 && git push origin v1.7.0
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Berechtigungen für Release-Erstellung
    permissions:
      contents: write
      packages: write
    
    steps:
      # 1. Repository auschecken
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Alle History für Git-Tags
      
      # 2. JDK 21 einrichten (für Android 35)
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      
      # 3. Android SDK einrichten
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Benötigte SDK Pakete (ohne sdk-version, da deprecated)
          packages: |
            platforms;android-35
            build-tools;35.0.0
            platform-tools
          # Akzeptiere Lizenzen automatisch
          accept-android-sdk-licenses: true
      
      # 4. Android NDK (falls für native Code benötigt)
      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: 'r26'
        id: ndk
      
      # 5. Gradle Cache für schnellere Builds
      - name: Gradle Cache
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.10.2'  # Muss mit gradle-wrapper.properties übereinstimmen
      
      # 6. Abhängigkeiten herunterladen
      - name: Download dependencies
        run: ./gradlew --no-daemon dependencies
      
      # 7. Mobile APK bauen (Release)
      - name: Build Mobile APK
        run: ./gradlew :mobile:assembleRelease --no-daemon --stacktrace
        env:
          # Android Keystore Konfiguration (optional für signed APKs)
          ANDROID_KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_FILE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      
      # 8. Wear APK bauen (Release)
      - name: Build Wear APK
        run: ./gradlew :wear:assembleRelease --no-daemon --stacktrace
        env:
          ANDROID_KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_FILE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      
      # 9. APK-Dateien finden und umbenennen (für bessere Lesbarkeit)
      - name: Rename APK files
        run: |
          # Mobile APK
          MOBILE_APK=$(find mobile/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -n "$MOBILE_APK" ]; then
            cp "$MOBILE_APK" mobile-release.apk
            echo "Mobile APK: mobile-release.apk"
          else
            # Fallback: Debug APK falls Release fehlschlägt
            MOBILE_APK=$(find mobile/build/outputs/apk/debug -name "*.apk" | head -1)
            if [ -n "$MOBILE_APK" ]; then
              cp "$MOBILE_APK" mobile-release.apk
              echo "Mobile APK: mobile-release.apk (debug fallback)"
            fi
          fi
          
          # Wear APK
          WEAR_APK=$(find wear/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -n "$WEAR_APK" ]; then
            cp "$WEAR_APK" wear-release.apk
            echo "Wear APK: wear-release.apk"
          else
            # Fallback: Debug APK falls Release fehlschlägt
            WEAR_APK=$(find wear/build/outputs/apk/debug -name "*.apk" | head -1)
            if [ -n "$WEAR_APK" ]; then
              cp "$WEAR_APK" wear-release.apk
              echo "Wear APK: wear-release.apk (debug fallback)"
            fi
          fi
          
          # Alle APKs anzeigen
          ls -lh *.apk || echo "No APKs found"
      
      # 10. Release erstellen und APKs hochladen
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # APK-Dateien hochladen
          files: |
            mobile-release.apk
            wear-release.apk
          # Tag-Name aus Git
          tag_name: ${{ github.ref_name }}
          # Release-Name
          name: Release ${{ github.ref_name }}
          # Release-Notizen aus CHANGELOG.md extrahieren
          body: |
            ### 📦 Downloads
            - [Mobile APK](https://github.com/christian98b/LockerLift/releases/download/${{ github.ref_name }}/mobile-release.apk)
            - [Wear APK](https://github.com/christian98b/LockerLift/releases/download/${{ github.ref_name }}/wear-release.apk)
            
            ### 📝 Changelog
            ${{ steps.changelog.outputs.content }}
          # Draft Release (kann später veröffentlicht werden)
          draft: false
          # Vorhandenes Release aktualisieren, falls Tag bereits existiert
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
      # 11. Changelog extrahieren (für Release-Notizen)
      - name: Extract changelog
        id: changelog
        run: |
          # Versuche, den Changelog für diese Version zu extrahieren
          if [ -f "CHANGELOG.md" ]; then
            # Extrahiere den Abschnitt für diese Version
            VERSION=${{ github.ref_name }}
            CONTENT=$(awk -v version="$VERSION" '
              /^## \[$version\]/ {found=1; next}
              found {print}
              /^## \[/ {exit}
            ' CHANGELOG.md)
            
            # Falls nichts gefunden, nehme den gesamten Changelog
            if [ -z "$CONTENT" ]; then
              CONTENT=$(cat CHANGELOG.md)
            fi
            
            # Für GitHub Actions Output (Zeilenumbrüche ersetzen)
            CONTENT="${CONTENT//'%'/'%25'}"
            CONTENT="${CONTENT//$'\n'/'%0A'}"
            CONTENT="${CONTENT//$'\r'/'%0D'}"
            echo "content=$CONTENT" >> $GITHUB_OUTPUT
          else
            echo "content=No changelog found" >> $GITHUB_OUTPUT
          fi
      
      # 12. Build-Artifacts speichern (für Debugging)
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-build-artifacts
          path: |
            mobile-release.apk
            wear-release.apk
            mobile/build/outputs/
            wear/build/outputs/
          retention-days: 7
