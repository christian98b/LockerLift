name: Test & Build APKs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_e2e_sync:
        description: "In-Memory E2E Synchronisations-Testsuite explizit ausführen"
        type: boolean
        required: false
        default: false

jobs:
  # 1. Test Stage: Execute unit tests across all modules
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch release tags
        run: git fetch --tags --force --quiet

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Android SDK
        run: ./scripts/ci-install-android-sdk.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check version consistency
        run: ./scripts/check-version.sh

      - name: Run Unit Tests
        run: |
          if [ "${{ github.event.inputs.run_e2e_sync }}" = "true" ]; then
            echo "=========================================================="
            echo "==> EXPLICIT TRIGGER: In-Memory E2E Sync Suite ACTIVE <== "
            echo "=========================================================="
            ./gradlew test -PrunE2eSync=true --no-daemon --stacktrace
          else
            echo "=========================================================="
            echo "==> STANDARD RUN: In-Memory E2E Sync Suite SKIPPED <======"
            echo "=========================================================="
            ./gradlew test --no-daemon --stacktrace
          fi

      - name: Check Room schema export is committed
        run: |
          if [ -n "$(git status --porcelain -- core/database/schemas)" ]; then
            echo "Room schema export drifted from the committed files"
            git status --porcelain -- core/database/schemas
            git diff -- core/database/schemas
            exit 1
          fi

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: "**/build/reports/tests/**"
          retention-days: 7

  # 2. Build Stage: Build Mobile and Wear OS APKs only if test job passes
  build-apks:
    name: Build APKs for Download
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Android SDK
        run: ./scripts/ci-install-android-sdk.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Mobile & Wear OS APKs
        run: ./gradlew :mobile:assemble :wear:assemble --no-daemon --stacktrace

      - name: Check minified release APKs
        run: |
          ./scripts/check-release-apk.sh "$(find mobile/build/outputs/apk/release -name '*.apk' | head -n 1)"
          ./scripts/check-release-apk.sh "$(find wear/build/outputs/apk/release -name '*.apk' | head -n 1)"

      - name: Upload APKs for Download
        uses: actions/upload-artifact@v4
        with:
          name: LockerLift-APKs-${{ github.sha }}
          path: |
            mobile/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/debug/*.apk
          retention-days: 30
