name: Test & Build APKs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_e2e_sync:
        description: "In-Memory E2E Synchronisations-Testsuite explizit ausführen"
        type: boolean
        required: false
        default: false

jobs:
  # 1. Test Stage: Execute unit tests across all modules
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK Environment
        run: |
          SDK_BIN=$(dirname $(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager | head -n 1))
          echo "$SDK_BIN" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
          cache-read-only: false

      - name: Run Unit Tests
        run: |
          if [ "${{ github.event.inputs.run_e2e_sync }}" = "true" ]; then
            echo "=========================================================="
            echo "==> EXPLICIT TRIGGER: In-Memory E2E Sync Suite ACTIVE <== "
            echo "=========================================================="
            gradle test -PrunE2eSync=true --no-daemon --stacktrace
          else
            echo "=========================================================="
            echo "==> STANDARD RUN: In-Memory E2E Sync Suite SKIPPED <======"
            echo "=========================================================="
            gradle test --no-daemon --stacktrace
          fi

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: "**/build/reports/tests/**"
          retention-days: 7

  # 2. Build Stage: Build Mobile and Wear OS APKs only if test job passes
  build-apks:
    name: Build APKs for Download
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK Environment
        run: |
          SDK_BIN=$(dirname $(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager | head -n 1))
          echo "$SDK_BIN" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build Mobile & Wear OS APKs
        run: gradle :mobile:assembleDebug :wear:assembleDebug --no-daemon --stacktrace

      - name: Upload APKs for Download
        uses: actions/upload-artifact@v4
        with:
          name: LockerLift-APKs-${{ github.sha }}
          path: |
            mobile/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/debug/*.apk
          retention-days: 30
