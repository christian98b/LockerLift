# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

# Single source of truth for the app release and SDK levels.
# versionName / versionCode are bumped only by scripts/bump-version.sh.
# Phone and watch share versionName. Play requires a unique versionCode per
# form factor for package com.lockerlift, so the watch uses
# versionCode + wearVersionCodeOffset (see README "Versioning").
# 1.12.0 shipped as code 20. Tags 1.13.0, 1.14.0 and 1.15.0 did not bump it,
# so the 1.15.0 line is code 23 (one step per missed release).
lockerlift.versionName=1.15.1
lockerlift.versionCode=24
lockerlift.wearVersionCodeOffset=100000
# compileSdk 36: Health Connect 1.1.0 and AboutLibraries require it.
# targetSdk stays 35 until a deliberate behaviour-change bump.
lockerlift.compileSdk=36
lockerlift.targetSdk=35
lockerlift.minSdk=28
lockerlift.wearMinSdk=30
